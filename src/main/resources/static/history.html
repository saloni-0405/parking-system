<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ParkEase – Booking History</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root {
      --primary: #00d4aa;
      --bg: #0a0e1a;
      --bg2: #111827;
      --bg3: #1a2236;
      --card: #151d2e;
      --border: rgba(255,255,255,0.07);
      --text: #e2e8f0;
      --muted: #64748b;
      --danger: #f43f5e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

    .navbar-custom {
      background: rgba(10,14,26,0.95); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border); padding: 14px 0;
      position: sticky; top: 0; z-index: 999;
    }
    .brand { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.4rem; color: var(--primary) !important; text-decoration: none; }
    .brand span { color: var(--text); }
    .nav-link-custom { color: var(--muted) !important; font-size: 0.88rem; text-decoration: none; transition: color 0.2s; padding: 6px 12px; border-radius: 8px; }
    .nav-link-custom:hover, .nav-link-custom.active { color: var(--primary) !important; }

    .page-hero { padding: 48px 0 32px; }
    .page-hero h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 2rem; }

    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
    .panel-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .panel-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 8px; }

    .search-input {
      background: var(--bg3); border: 1px solid var(--border); color: var(--text);
      border-radius: 10px; padding: 8px 14px; font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem; outline: none; width: 220px;
    }
    .search-input:focus { border-color: var(--primary); }

    .hist-table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
    .hist-table thead th {
      font-size: 0.72rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.5px; padding: 0 14px 10px;
      border-bottom: 1px solid var(--border);
    }
    .hist-table tbody tr { background: var(--bg3); }
    .hist-table tbody td { padding: 14px 14px; font-size: 0.88rem; }
    .hist-table tbody td:first-child { border-radius: 8px 0 0 8px; border: 1px solid var(--border); border-right: none; }
    .hist-table tbody td:last-child { border-radius: 0 8px 8px 0; border: 1px solid var(--border); border-left: none; }
    .hist-table tbody td:not(:first-child):not(:last-child) { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }

    .badge-active { background: rgba(0,212,170,0.1); color: var(--primary); border: 1px solid rgba(0,212,170,0.25); border-radius: 50px; padding: 3px 10px; font-size: 0.72rem; font-weight: 600; }
    .badge-done { background: rgba(100,116,139,0.1); color: var(--muted); border: 1px solid var(--border); border-radius: 50px; padding: 3px 10px; font-size: 0.72rem; font-weight: 600; }
  </style>
</head>
<body>

  <nav class="navbar-custom">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="brand">Park<span>Ease</span></a>
      <div class="d-flex gap-2">
        <a href="index.html" class="nav-link-custom"><i class="bi bi-grid-3x3-gap me-1"></i>Slots</a>
        <a href="history.html" class="nav-link-custom active"><i class="bi bi-clock-history me-1"></i>History</a>
        <a href="admin.html" class="nav-link-custom"><i class="bi bi-shield-lock me-1"></i>Admin</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="page-hero">
      <h1><i class="bi bi-clock-history me-2" style="color:var(--primary)"></i>Booking History</h1>
      <p style="color:var(--muted);margin-top:8px">All parking bookings — active and completed</p>
    </div>

    <div class="panel mb-5">
      <div class="panel-header">
        <div class="panel-title"><i class="bi bi-list-ul"></i> All Records <span id="rec-count" style="color:var(--muted);font-weight:400;font-size:0.82rem"></span></div>
        <input type="text" class="search-input" placeholder="Search by name or slot…" oninput="filterHistory(this.value)"/>
      </div>
      <div style="padding:16px 24px">
        <div class="table-responsive">
          <table class="hist-table">
            <thead>
              <tr>
                <th>#</th><th>Slot</th><th>Name</th><th>Vehicle</th>
                <th>Start</th><th>End</th><th>Duration</th><th>Status</th>
              </tr>
            </thead>
            <tbody id="hist-tbody">
              <tr><td colspan="8" class="text-center py-4" style="color:var(--muted)">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API = 'http://localhost:8080';
    let allRecs = [];

    async function loadHistory() {
      try {
        const res = await fetch(`${API}/bookings`);
        allRecs = await res.json();
        document.getElementById('rec-count').textContent = `(${allRecs.length})`;
        renderHistory(allRecs);
      } catch(e) {
        document.getElementById('hist-tbody').innerHTML =
          '<tr><td colspan="8" class="text-center text-danger py-4">Cannot connect to server</td></tr>';
      }
    }

    function renderHistory(recs) {
      const tbody = document.getElementById('hist-tbody');
      if (!recs.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5" style="color:var(--muted)">No bookings found</td></tr>';
        return;
      }
      tbody.innerHTML = recs.map(b => {
        const start = new Date(b.startTime);
        const end = b.endTime ? new Date(b.endTime) : null;
        let dur = '–';
        if (end) { const m = Math.floor((end-start)/60000); dur = m < 60 ? m+'m' : Math.floor(m/60)+'h '+m%60+'m'; }
        return `<tr>
          <td style="color:var(--muted);font-size:0.75rem">#${b.id}</td>
          <td><strong style="font-family:'Syne',sans-serif;color:var(--primary)">${b.slot.slotNumber}</strong></td>
          <td>${b.userName}</td>
          <td style="font-family:monospace;font-size:0.82rem">${b.vehicleNumber}</td>
          <td style="color:var(--muted);font-size:0.8rem">${start.toLocaleString()}</td>
          <td style="color:var(--muted);font-size:0.8rem">${end ? end.toLocaleString() : '<span style="color:var(--primary)">Active</span>'}</td>
          <td>${dur}</td>
          <td><span class="${b.status === 'ACTIVE' ? 'badge-active' : 'badge-done'}">${b.status}</span></td>
        </tr>`;
      }).join('');
    }

    function filterHistory(q) {
      const f = allRecs.filter(b =>
        b.userName.toLowerCase().includes(q.toLowerCase()) ||
        b.slot.slotNumber.toLowerCase().includes(q.toLowerCase()) ||
        b.vehicleNumber.toLowerCase().includes(q.toLowerCase())
      );
      renderHistory(f);
    }

    loadHistory();
  </script>
</body>
</html>
